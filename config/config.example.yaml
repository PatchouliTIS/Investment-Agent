# Investment Agent 配置文件
# 复制此文件为 config.yaml 并填入你的实际配置

watchlist:
  a_shares:
    # 主线一：AI算力 (40%)
    - "688256"    # 寒武纪 - AI芯片国产替代龙头
    - "002475"    # 立讯精密 - AI服务器代工核心
    - "688012"    # 中微公司 - 刻蚀设备国产龙头
    # 主线二：半导体设备 (30%)
    - "688981"    # 中芯国际 - 晶圆代工国内龙一
    - "002371"    # 北方华创 - 半导体设备平台龙头
    - "603501"    # 韦尔股份 - CIS图像传感器龙头
    # 主线三：新能源龙头 (30%)
    - "300750"    # 宁德时代 - 动力电池全球龙一
    - "002594"    # 比亚迪 - 整车+电池一体化
    - "300274"    # 阳光电源 - 储能核心增长引擎
  funds:
    - "159819"    # 人工智能ETF
    - "512480"    # 半导体ETF
    - "515030"    # 新能源车ETF
  hk_stocks: []
  us_stocks: []

llm:
  model: "claude-opus-4-6"           # 日常分析模型
  api_key: "${AICODING_API_KEY}"     # 存储在 .env 中
  base_url: "https://wawapii.com/v1/messages"
  temperature: 0.3
  max_tokens: 4096

# 深度分析用更强模型 (可选，使用同一API)
llm_deep:
  model: "claude-opus-4-6"
  api_key: "${AICODING_API_KEY}"
  base_url: "https://wawapii.com/v1/messages"
  temperature: 0.2
  max_tokens: 8192

email:
  smtp_host: "smtp.qq.com"
  smtp_port: 465
  use_ssl: true
  sender: "your_email@qq.com"
  password: "${EMAIL_SMTP_PASSWORD}"
  recipients:
    - "your_email@qq.com"

schedule:
  data_sync_cron: "0 18 * * 1-5"       # 周一至周五 18:00 收盘后同步
  daily_report_cron: "30 19 * * 1-5"    # 周一至周五 19:30 发送日报
  weekly_report_cron: "0 10 * * 6"      # 周六 10:00 发送周报

alerts:
  price_change_threshold: 5.0           # 单日涨跌幅超过5%触发告警
  volume_spike_threshold: 3.0           # 成交量超过20日均量3倍触发
  stop_loss_threshold: -15.0            # 止损线：累计跌幅超-15%触发

database:
  path: "data/investment.db"

# 个人财务画像（用于组合顾问生成仓位/定投建议）
profile:
  monthly_income: 40000      # 税前月收入（元）
  available_cash: 200000     # 可支配资金（元）
  fund_assets: 300000        # 基金资产（元）
  risk_preference: "中等"    # 风险偏好：低/中等/高

log_level: "INFO"
