# 截图中的同花顺指数编码：科创50 1B0688（标准代码 000688）、
# 上证指数 1A0001（标准代码 000001）、存储芯片 886042。
# 当前 Agent 未实现指数数据同步和分析，故不放入上述可同步观察池。

llm:
  provider: "anthropic"              # openai | anthropic | ollama
  model: "claude-fable-5"           # 日常分析用低成本模型
  api_key: "${ANTHROPIC_API_KEY}"
  base_url: "https://wawapii.com"
  temperature: 1.0
  max_tokens: 2048
  output_format: "json"
  text_response_max_chars: 250
  max_retries: 0
  retry_delay_seconds: 2.0
  timeout_seconds: 90.0

# 深度分析用更强模型 (可选)
llm_deep:
  provider: "anthropic"
  model: "claude-fable-5"
  api_key: "${ANTHROPIC_API_KEY}"
  base_url: "https://wawapii.com"
  temperature: 1.0
  max_tokens: 4096
  output_format: "json"
  text_response_max_chars: 500
  max_retries: 0
  retry_delay_seconds: 2.0
  timeout_seconds: 120.0

email:
  smtp_host: "smtp.qq.com"
  smtp_port: 465
  use_ssl: true
  sender: "pyramkar@qq.com"
  password: "${EMAIL_SMTP_PASSWORD}"
  recipients:
    - "pyramkar@qq.com"

schedule:
  data_sync_cron: "0 18 * * 1-5"       # 周一至周五 18:00 收盘后同步
  alert_check_cron: "30 18 * * 1-5"     # 周一至周五 18:30，根据最新日线告警
  daily_report_cron: "30 19 * * 1-5"    # 周一至周五 19:30 发送日报
  weekly_report_cron: "0 10 * * 6"      # 周六 10:00 发送周报

alerts:
  price_change_threshold: 5.0           # 涨跌幅超过5%触发告警
  volume_spike_threshold: 3.0           # 成交量超过20日均量3倍触发

akshare:
  use_env_proxy: false                  # 绕过 shell 中的 http_proxy/https_proxy
  max_retries: 2                        # 临时网络失败后的重试次数
  retry_delay_seconds: 2.0              # 首次重试等待秒数，后续指数退避

investor_profile:
  monthly_income: 40000                  # 税前月收入（元），不填则不纳入建议
  investable_cash: 100000                 # 当前可投资现金（元）
  fund_assets: 200000                     # 当前基金资产（元）
  risk_preference: "稳健"               # 保守 / 稳健 / 进取

database:
  path: "data/investment.db"

log_level: "DEBUG"
